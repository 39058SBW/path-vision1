<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Path Vision AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0f1e; color: #fff; min-height: 100vh; }
#header { background: #0d1526; padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e3050; }
#header h1 { font-size: 18px; font-weight: 600; color: #e2f0ff; flex: 1; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #1a3a5c; color: #7eb8f7; }
#tabs { display: flex; background: #0d1526; border-bottom: 1px solid #1e3050; }
.tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 500; color: #4a6a8a; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #4da6ff; border-bottom-color: #4da6ff; }
#panel-camera { display: block; }
#panel-upload, #panel-settings { display: none; }
#tts-banner { display: none; background: #1a3a1a; border: 1px solid #2a6a2a; border-radius: 10px; margin: 10px 12px 0; padding: 11px; font-size: 13px; color: #7dcf7d; text-align: center; cursor: pointer; font-weight: 600; }
#view-wrap { position: relative; width: 100%; background: #000; min-height: 220px; }
#video { width: 100%; display: none; }
#canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#cam-placeholder { width: 100%; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#cam-placeholder .ph-icon { font-size: 48px; margin-bottom: 8px; }
#cam-placeholder p { font-size: 13px; color: #4a6a8a; }
#status-bar { padding: 8px 12px; display: flex; align-items: center; gap: 8px; background: #0d1526; border-bottom: 1px solid #1e3050; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #334; flex-shrink: 0; }
.dot.active { background: #22c55e; animation: pulse 1.5s infinite; }
.dot.busy { background: #f59e0b; animation: pulse 0.7s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
#status-text { font-size: 12px; color: #4a8aaa; flex: 1; }
#result-box { margin: 12px; padding: 16px; border-radius: 14px; background: #0d1526; border: 1px solid #1e3050; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 100px; justify-content: center; }
#result-icon { font-size: 36px; }
#result-main { font-size: 19px; font-weight: 700; text-align: center; }
#result-detail { font-size: 13px; color: #4a8aaa; text-align: center; line-height: 1.5; }
#controls { padding: 0 12px 14px; display: flex; gap: 8px; }
#btn-start { flex: 1; background: #1a6fd4; color: #fff; border: none; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer; }
#btn-start.stop { background: #dc2626; }
#btn-speak { background: #0d1526; color: #7eb8f7; border: 1px solid #1e3050; border-radius: 12px; padding: 15px 18px; font-size: 20px; cursor: pointer; }
#btn-speak:disabled { opacity: 0.35; }
/* Upload */
#upload-tab { padding: 14px; }
#drop-zone { border: 1.5px dashed #1e3050; border-radius: 14px; padding: 28px 16px; text-align: center; cursor: pointer; margin-bottom: 10px; }
#drop-zone .dz-icon { font-size: 36px; display: block; margin-bottom: 6px; }
#drop-zone p { font-size: 13px; color: #4a8aaa; }
#drop-zone span { color: #4da6ff; }
#file-input { display: none; }
#preview-img { width: 100%; border-radius: 12px; display: none; margin-bottom: 10px; }
#btn-reset { display: none; background: transparent; color: #4a8aaa; border: 1px solid #1e3050; border-radius: 10px; padding: 7px 12px; font-size: 12px; cursor: pointer; margin-bottom: 8px; }
#btn-analyze { width: 100%; background: #1a6fd4; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: none; margin-bottom: 10px; }
#upload-result { padding: 16px; border-radius: 14px; background: #0d1526; border: 1px solid #1e3050; display: none; }
#upload-result-main { font-size: 17px; font-weight: 600; margin-bottom: 6px; text-align: center; }
#upload-result-detail { font-size: 13px; color: #aaa; line-height: 1.6; }
/* Settings */
#settings-tab { padding: 14px; }
.srow { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #1e3050; }
.slabel { font-size: 13px; color: #4a8aaa; }
select { background: #0d1526; color: #e2f0ff; border: 1px solid #1e3050; border-radius: 8px; padding: 5px 8px; font-size: 12px; }
.range-row { padding: 10px 0; border-bottom: 1px solid #1e3050; }
.range-label { font-size: 12px; color: #4a8aaa; display: flex; justify-content: space-between; margin-bottom: 4px; }
#freq-val { color: #4da6ff; font-weight: 600; }
input[type=range] { width: 100%; accent-color: #4da6ff; }
</style>
</head>
<body>

<div id="header">
  <span style="font-size:22px">👁️</span>
  <h1>Path Vision AI</h1>
  <span class="badge">Gemini AI</span>
</div>

<div id="tabs">
  <div class="tab active" id="tab-camera" onclick="switchTab('camera')">📷 กล้องสด</div>
  <div class="tab" id="tab-upload" onclick="switchTab('upload')">📤 อัพโหลด</div>
  <div class="tab" id="tab-settings" onclick="switchTab('settings')">⚙️ ตั้งค่า</div>
</div>

<!-- CAMERA -->
<div id="panel-camera">
  <div id="tts-banner" onclick="unlockTTS()">🔊 แตะที่นี่เพื่อเปิดเสียงพูด (กดครั้งเดียว)</div>
  <div id="view-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-overlay"></canvas>
    <div id="cam-placeholder">
      <span class="ph-icon">📵</span>
      <p>กดปุ่มเริ่มเพื่อเปิดกล้อง</p>
    </div>
  </div>
  <div id="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">พร้อมใช้งาน</span>
  </div>
  <div id="result-box">
    <span id="result-icon">👁️</span>
    <div id="result-main">รอการวิเคราะห์</div>
    <div id="result-detail">กดเริ่มเพื่อตรวจสอบเส้นทาง</div>
  </div>
  <div id="controls">
    <button id="btn-start" onclick="toggleCamera()">📷 เริ่มกล้อง</button>
    <button id="btn-speak" onclick="speakNow()" disabled>🔊</button>
  </div>
</div>

<!-- UPLOAD -->
<div id="panel-upload">
  <div id="upload-tab">
    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      <span class="dz-icon">🖼️</span>
      <p>แตะเพื่อเลือกรูปภาพ<br><span>รองรับ JPG, PNG, HEIC</span></p>
    </div>
    <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
    <button id="btn-reset" onclick="resetUpload()">✕ เลือกรูปใหม่</button>
    <img id="preview-img" alt="preview">
    <button id="btn-analyze" onclick="analyzeUpload()">🔍 วิเคราะห์ด้วย Gemini</button>
    <div id="upload-result">
      <div id="upload-result-main"></div>
      <div id="upload-result-detail"></div>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="panel-settings">
  <div id="settings-tab">
    <div class="srow">
      <span class="slabel">ภาษาเสียง</span>
      <select id="voice-lang">
        <option value="th-TH">ภาษาไทย</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <div class="range-row">
      <div class="range-label"><span>ความถี่วิเคราะห์</span><span id="freq-val">4 วิ</span></div>
      <input type="range" id="freq-slider" min="3" max="10" value="4" step="1"
        oninput="document.getElementById('freq-val').textContent=this.value+' วิ'">
    </div>
    <div class="srow">
      <span class="slabel">โมเดล Gemini</span>
      <select id="model-select">
        <option value="gemini-2.5-flash-preview-05-20">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro-preview-05-06">gemini-2.5-pro</option>
      </select>
    </div>
  </div>
</div>

<script>
const GEMINI_KEY = "AQ.Ab8RN6IUP4sh7eslXzI6cqr5rhDGhniIga5Eys2i-CqMjb_HfQ";

const PROMPT = `คุณเป็น AI ช่วยเหลือผู้พิการทางสายตาในการเดิน

วิเคราะห์ภาพนี้แล้วตอบเป็น JSON เท่านั้น ไม่มีข้อความอื่น ไม่มี markdown:
{
  "safe": true หรือ false,
  "icon": อีโมจิ 1 ตัว,
  "main": "ข้อความหลัก 1 บรรทัด ภาษาไทย",
  "detail": "รายละเอียด 1-2 บรรทัด ภาษาไทย",
  "speech": "ข้อความพูดออกเสียง ภาษาไทย กระชับ"
}

กฎ:
- ถ้าเห็นทางเดิน/พื้น/ถนนโล่งไม่มีสิ่งกีดขวาง → safe: true
- ถ้าเห็นคน/สัตว์/รถ/สิ่งของ/ขั้นบันได/สิ่งกีดขวางใดๆ → safe: false
- speech ต้องสั้น ไม่เกิน 2 ประโยค พูดชัดเจน`;

let streaming = false, mediaStream = null, timer = null;
let lastMsg = "", uploadFileData = null, ttsUnlocked = false;
const video = document.getElementById('video');

// ---- TTS ----
function unlockTTS() {
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  ttsUnlocked = true;
  document.getElementById('tts-banner').style.display = 'none';
}
function checkTTS() {
  if (!ttsUnlocked) document.getElementById('tts-banner').style.display = 'block';
}
function speak(text) {
  if (!text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = document.getElementById('voice-lang').value;
  u.rate = 0.9; u.volume = 1;
  if (window.speechSynthesis.paused) window.speechSynthesis.resume();
  const lang = u.lang.split('-')[0];
  const v = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith(lang));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
  setTimeout(() => { if (window.speechSynthesis.paused) window.speechSynthesis.resume(); }, 600);
}
function speakNow() { unlockTTS(); if (lastMsg) speak(lastMsg); }

// ---- UI ----
function switchTab(t) {
  ['camera','upload','settings'].forEach(x => {
    document.getElementById('panel-'+x).style.display = x===t?'block':'none';
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
  });
}
function setStatus(txt, state) {
  document.getElementById('status-text').textContent = txt;
  const d = document.getElementById('dot');
  d.className = 'dot'+(state==='active'?' active':state==='busy'?' busy':'');
}
function setResult(icon, main, detail, color) {
  document.getElementById('result-icon').textContent = icon;
  const m = document.getElementById('result-main');
  m.textContent = main; m.style.color = color||'#e2f0ff';
  document.getElementById('result-detail').textContent = detail;
}

// ---- Camera ----
async function toggleCamera() { streaming ? stopCamera() : await startCamera(); }

async function startCamera() {
  checkTTS();
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    video.srcObject = mediaStream;
    await video.play();
    document.getElementById('cam-placeholder').style.display = 'none';
    video.style.display = 'block';
    // ปรับ canvas ให้ตรงกับ video
    const overlay = document.getElementById('canvas-overlay');
    overlay.style.display = 'none'; // ไม่ใช้ bounding box กับ gemini
    streaming = true;
    document.getElementById('btn-start').textContent = '⏹ หยุด';
    document.getElementById('btn-start').classList.add('stop');
    document.getElementById('btn-speak').disabled = false;
    setStatus('กำลังทำงาน', 'active');
    const freq = parseInt(document.getElementById('freq-slider').value) * 1000;
    setTimeout(snap, 1500);
    timer = setInterval(snap, freq);
  } catch(e) {
    alert('เปิดกล้องไม่ได้\nกรุณาอนุญาต Camera\nError: ' + e.message);
  }
}

function stopCamera() {
  clearInterval(timer);
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  mediaStream = null; streaming = false;
  video.style.display = 'none';
  document.getElementById('cam-placeholder').style.display = 'flex';
  document.getElementById('btn-start').textContent = '📷 เริ่มกล้อง';
  document.getElementById('btn-start').classList.remove('stop');
  document.getElementById('btn-speak').disabled = true;
  setStatus('หยุดแล้ว', '');
}

function snap() {
  if (!streaming || video.readyState < 2 || !video.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  c.toBlob(b => { if (b) analyzeBlob(b, true); }, 'image/jpeg', 0.82);
}

// ---- Gemini API ----
async function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function analyzeBlob(blob, isCamera) {
  if (isCamera) setStatus('Gemini กำลังวิเคราะห์...', 'busy');
  try {
    const b64 = await blobToBase64(blob);
    const model = document.getElementById('model-select').value;
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: PROMPT },
              { inline_data: { mime_type: 'image/jpeg', data: b64 } }
            ]
          }],
          generationConfig: { temperature: 0.1, maxOutputTokens: 300 }
        })
      }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    // clean JSON
    const clean = raw.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);
    showResult(result, isCamera);
    if (isCamera) setStatus('กำลังทำงาน', 'active');
  } catch(e) {
    if (isCamera) {
      setStatus('ข้อผิดพลาด', '');
      setResult('⚠️', 'วิเคราะห์ไม่ได้', e.message, '#ef4444');
    } else {
      document.getElementById('upload-result').style.display = 'block';
      document.getElementById('upload-result-main').textContent = '⚠️ วิเคราะห์ไม่ได้';
      document.getElementById('upload-result-main').style.color = '#ef4444';
      document.getElementById('upload-result-detail').textContent = e.message;
    }
  }
}

function showResult(r, isCamera) {
  const icon   = r.icon   || '👁️';
  const main   = r.main   || 'ไม่ทราบ';
  const detail = r.detail || '';
  const speech = r.speech || main;
  const color  = r.safe ? '#22c55e' : '#ef4444';

  if (isCamera) {
    setResult(icon, main, detail, color);
    if (speech !== lastMsg) { lastMsg = speech; speak(speech); }
  } else {
    document.getElementById('upload-result').style.display = 'block';
    const m = document.getElementById('upload-result-main');
    m.textContent = icon + ' ' + main; m.style.color = color;
    document.getElementById('upload-result-detail').textContent = detail;
    speak(speech);
    lastMsg = speech;
    document.getElementById('btn-speak').disabled = false;
  }
}

// ---- Upload ----
function handleFile(e) { const f=e.target.files[0]; if(f) loadImg(f); }

function loadImg(file) {
  uploadFileData = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('preview-img');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'inline-block';
    document.getElementById('btn-analyze').style.display = 'block';
    document.getElementById('upload-result').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function resetUpload() {
  uploadFileData = null;
  document.getElementById('preview-img').style.display = 'none';
  document.getElementById('drop-zone').style.display = 'block';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('btn-analyze').style.display = 'none';
  document.getElementById('upload-result').style.display = 'none';
  document.getElementById('file-input').value = '';
}

async function analyzeUpload() {
  if (!uploadFileData) return;
  unlockTTS();
  document.getElementById('upload-result').style.display = 'block';
  document.getElementById('upload-result-main').textContent = '⏳ Gemini กำลังวิเคราะห์...';
  document.getElementById('upload-result-main').style.color = '#e2f0ff';
  document.getElementById('upload-result-detail').textContent = '';
  await analyzeBlob(uploadFileData, false);
}

// drag & drop
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => e.preventDefault());
dz.addEventListener('drop', e => { e.preventDefault(); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) loadImg(f); });

if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
